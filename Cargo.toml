[workspace]
resolver = "3"
members = ["kernel"]

[package]
name = "pvkernel-runner"
license = "MIT OR Apache-2.0"
version = "0.0.4"
edition = "2024"
publish = false
description = "An experimental x86_64 operating system kernel written in Rust, developed as the foundation of pvOS."
repository = "https://github.com/ultronstudio/pvkernel"

[dependencies]
ovmf-prebuilt = "0.2.4"

[features]
default = []
# Forwards to the kernel's page-fault boot test; see docs/development/debugging.md.
fault-tests = ["kernel/fault-tests"]
# Forwards to the kernel's deterministic QEMU test support; see docs/development/testing.md.
qemu-test = ["kernel/qemu-test"]

[build-dependencies]
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "=0.11.17"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
