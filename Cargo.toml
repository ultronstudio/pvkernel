[workspace]
resolver = "3"
members = ["kernel"]

# Single authoritative version (and shared metadata) for every crate in the
# workspace. `kernel/Cargo.toml` inherits `version.workspace = true` instead
# of repeating the literal string, so a release can never bump one crate's
# version and silently miss the other; see
# docs/security/vulnerability-management.md and the release workflows for
# why that consistency matters at release time.
[workspace.package]
version = "0.0.6"
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/ultronstudio/pvkernel"

[package]
name = "pvkernel-runner"
license.workspace = true
version.workspace = true
edition.workspace = true
publish = false
description = "An experimental x86_64 operating system kernel written in Rust, developed as the foundation of pvOS."
repository.workspace = true

[dependencies]
ovmf-prebuilt = "0.2.4"

[features]
default = []
# Forwards to the kernel's page-fault boot test; see docs/development/debugging.md.
fault-tests = ["kernel/fault-tests"]
# Forwards to the kernel's post-unmap page-fault boot test; see
# docs/development/memory-testing.md.
mem-fault-tests = ["kernel/mem-fault-tests"]
# Forwards to the deterministic CPL0 read-only-page write test; see
# docs/development/memory-testing.md.
supervisor-write-protection-test = ["kernel/supervisor-write-protection-test"]
# Forwards to the kernel's deterministic QEMU test support; see docs/development/testing.md.
qemu-test = ["kernel/qemu-test"]
# Forwards to the kernel's ring-3 entry/syscall test scaffolding; see
# docs/architecture/userspace-entry.md. Not meant to be enabled directly.
userspace-test = ["kernel/userspace-test"]
# Forwards to the kernel's userspace syscall-boundary test; see
# docs/development/userspace-testing.md.
userspace-syscall-test = ["kernel/userspace-syscall-test"]
# Forwards to the kernel's userspace privilege-fault test; see
# docs/development/userspace-testing.md.
userspace-privilege-fault-test = ["kernel/userspace-privilege-fault-test"]
# Forwards to the kernel's userspace supervisor-page-fault test; see
# docs/development/userspace-testing.md.
userspace-supervisor-fault-test = ["kernel/userspace-supervisor-fault-test"]

[build-dependencies]
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "=0.11.17"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
