name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets release-candidate.yml/release.yml run this exact same correctness
  # gate as one of their required jobs, instead of duplicating it.
  workflow_call:

# Least privilege by default: this workflow only reads the repository and
# never needs to push commits, create releases, or comment on PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every cargo invocation below uses --locked explicitly as well; this is
  # a defense-in-depth default for any cargo subcommand that doesn't.
  CARGO_NET_OFFLINE: "false"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain
        # Installs the exact dated nightly, profile, components and targets
        # declared in rust-toolchain.toml. Reproducible: every runner and
        # every contributor's machine resolves to the same compiler build.
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      # Each package is clippy-checked with its own single `-p` selection,
      # deliberately NOT `cargo clippy --workspace`. Selecting `kernel` and
      # `pvkernel-runner` as two simultaneous root units makes Cargo's
      # feature resolver unify features across both root units' dependency
      # graphs; on at least one real toolchain/platform combination this
      # unifies a `std`-enabling feature into `kernel`'s otherwise-`no_std`
      # build of `bitflags` (a transitive dependency via the `x86_64`
      # crate), which collides with `kernel`'s own `#[panic_handler]`
      # (`error[E0152]: found duplicate lang item 'panic_impl'`) - the same
      # failure `--all-targets` causes for a different reason (building
      # `kernel`'s disabled test-harness variant, see `kernel/Cargo.toml`'s
      # `test = false`). Checking one package at a time, with `kernel`'s
      # real target explicit, never selects two root units together, so
      # this cross-target unification never has a chance to occur. No
      # lints are suppressed; both packages are still fully checked.
      - name: Clippy (kernel, cross target)
        run: cargo clippy -p kernel --locked --target x86_64-unknown-none -- -D warnings

      - name: Clippy (pvkernel-runner, host target)
        run: cargo clippy -p pvkernel-runner --locked -- -D warnings

  build:
    name: Build (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - fault-tests
          - mem-fault-tests
          - qemu-test
          - "qemu-test fault-tests"
          - "qemu-test mem-fault-tests"
          - userspace-syscall-test
          - userspace-privilege-fault-test
          - userspace-supervisor-fault-test
          - "qemu-test userspace-syscall-test"
          - "qemu-test userspace-privilege-fault-test"
          - "qemu-test userspace-supervisor-fault-test"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-${{ matrix.features }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-

      - name: Build
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo build --locked
          else
            cargo build --locked --features "${{ matrix.features }}"
          fi

  qemu-timer:
    name: QEMU / timer boot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/qemu-scenario
        with:
          features: qemu-test
          description: >-
            Boots headlessly, unmasks the PIT IRQ, enables hardware
            interrupts, and verifies the tick counter advances.

  qemu-page-fault:
    name: QEMU / expected page fault
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/qemu-scenario
        with:
          features: "qemu-test fault-tests"
          description: >-
            Deliberately dereferences an unmapped address; the handler
            matches it against the expected faulting address and exits
            successfully instead of halting.

  qemu-post-unmap-fault:
    name: QEMU / post-unmap page fault
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/qemu-scenario
        with:
          features: "qemu-test mem-fault-tests"
          description: >-
            Maps a page, writes and verifies a sentinel value, unmaps it,
            then deliberately re-accesses it; the handler matches the
            resulting not-present fault against the expected address.

  qemu-cpl3-syscall:
    name: QEMU / CPL3 syscall boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/qemu-scenario
        with:
          features: "qemu-test userspace-syscall-test"
          description: >-
            Transitions into CPL3 via iretq, exercises the int 0x80
            bootstrap ABI (unknown syscall, ABI_VERSION_QUERY,
            DEBUG_WRITE_BYTE), confirms a PIT tick interrupts and resumes
            CPL3 execution, then exits via TEST_EXIT.

  qemu-cpl3-privilege-fault:
    name: QEMU / CPL3 privileged-instruction fault
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/qemu-scenario
        with:
          features: "qemu-test userspace-privilege-fault-test"
          description: >-
            Transitions into CPL3 via iretq, then executes cli; the
            resulting #GP is matched against its expected CPL3 origin.

  qemu-cpl3-supervisor-fault:
    name: QEMU / CPL3 supervisor-memory fault
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/qemu-scenario
        with:
          features: "qemu-test userspace-supervisor-fault-test"
          description: >-
            Transitions into CPL3 via iretq, then reads a mapped-but-
            supervisor-only page; the resulting #PF is matched against the
            expected address and error-code bits.
