name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Format and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        # Installs the exact channel, components and targets declared in
        # rust-toolchain.toml, so CI always matches local development.
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build

      - name: Build with fault-tests feature
        run: cargo build --features fault-tests

      - name: Build with mem-fault-tests feature
        run: cargo build --features mem-fault-tests

      - name: Build with qemu-test feature
        run: cargo build --features qemu-test

      - name: Build with qemu-test and fault-tests features
        run: cargo build --features "qemu-test fault-tests"

      - name: Build with qemu-test and mem-fault-tests features
        run: cargo build --features "qemu-test mem-fault-tests"

  qemu-tests:
    name: Deterministic QEMU interrupt tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        # GitHub-hosted runners start from a cold cache on every run, and
        # this workspace pulls in the full bootloader/cargo-xtask dependency
        # tree plus prebuilt OVMF firmware. Caching keeps compile time out of
        # the timeouts below instead of counting against them.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-qemu-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-qemu-tests-

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Build timer interrupt test binary
        # Compiling here (untimed) keeps a cold-cache build from eating into
        # the "timeout" budget of the run step below.
        run: cargo build --features qemu-test

      - name: Run timer interrupt test
        # Boots headlessly, unmasks the PIT IRQ, enables hardware interrupts
        # and verifies the tick counter advances, then exits QEMU
        # deterministically via isa-debug-exit. Times out (and fails) if the
        # kernel never reaches the success exit. GitHub-hosted runners have
        # no /dev/kvm, so QEMU falls back to slower TCG emulation; the
        # timeout is generous to absorb that.
        run: timeout 120 cargo run --features qemu-test -- --headless-test

      - name: Build expected page-fault test binary
        run: cargo build --features "qemu-test fault-tests"

      - name: Run expected page-fault test
        # Same as above, plus a deliberate page fault after the timer test;
        # the handler matches it against the expected faulting address and
        # exits successfully instead of halting.
        run: timeout 120 cargo run --features "qemu-test fault-tests" -- --headless-test

      - name: Build expected post-unmap page-fault test binary
        run: cargo build --features "qemu-test mem-fault-tests"

      - name: Run expected post-unmap page-fault test
        # Maps a page, writes and verifies a sentinel value, unmaps it, then
        # deliberately re-accesses it; the handler matches the resulting
        # not-present fault against the expected address and exits
        # successfully instead of halting.
        run: timeout 120 cargo run --features "qemu-test mem-fault-tests" -- --headless-test
