name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Format and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        # Installs the exact channel, components and targets declared in
        # rust-toolchain.toml, so CI always matches local development.
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build
