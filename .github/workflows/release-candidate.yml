name: Release candidate

# Manual only: a release candidate is never cut automatically from a push
# or schedule. See docs/security/vulnerability-management.md and
# docs/security/release-policy.md for the three release classes
# (development build / release candidate / stable release).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target stable version this RC is for, e.g. "0.0.7" (no "v", no "-rc" suffix).'
        required: true
      rc:
        description: 'RC number, e.g. "1" for v0.0.7-rc.1.'
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  # Deliberately not cancel-in-progress: an in-flight release build should
  # finish (or fail on its own terms) rather than being silently killed by
  # a second dispatch.
  group: release-candidate-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and release prerequisites
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      rc: ${{ steps.version.outputs.rc }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned toolchain
        run: rustup show

      - name: Validate inputs and derive tag
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          rc="${{ inputs.rc }}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$version' is not a bare X.Y.Z semantic version" >&2
            exit 1
          fi
          if ! [[ "$rc" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::rc '$rc' is not a positive integer" >&2
            exit 1
          fi

          tag="v${version}-rc.${rc}"
          {
            echo "version=$version"
            echo "rc=$rc"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Verify exact pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -oP '(?<=channel = ")[^"]+' rust-toolchain.toml)
          if ! [[ "$channel" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::rust-toolchain.toml channel '$channel' is not an exact dated nightly" >&2
            exit 1
          fi
          echo "Pinned toolchain: $channel"
          rustc -Vv

      - name: Verify Cargo/workspace version matches requested version
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          runner_version=$(cargo metadata --locked --format-version 1 --no-deps \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='pvkernel-runner'))")
          kernel_version=$(cargo metadata --locked --format-version 1 --no-deps --manifest-path kernel/Cargo.toml \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='kernel'))")

          if [ "$runner_version" != "$version" ] || [ "$kernel_version" != "$version" ]; then
            echo "::error::package versions (runner=$runner_version, kernel=$kernel_version) do not match requested version $version" >&2
            exit 1
          fi
          echo "pvkernel-runner and kernel both report version $version"

      - name: Verify CHANGELOG.md has an entry for this version
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' entry" >&2
            exit 1
          fi

      - name: Verify Cargo.lock is committed
        run: git ls-files --error-unmatch Cargo.lock

      - name: Verify tag does not already exist
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; refusing to reuse it" >&2
            exit 1
          fi

  ci:
    name: Correctness gate
    needs: validate
    uses: ./.github/workflows/ci.yml

  security:
    name: Security gate
    needs: validate
    # A reusable workflow's jobs can never receive more than the calling
    # job grants (permissions only narrow across a `uses:` boundary, never
    # widen) - and actionlint statically verifies this across every nested
    # job regardless of its runtime `if:` condition, so every permission
    # any job in security.yml could need must be granted here even though
    # `dependency-review` never actually runs in this workflow_dispatch-only
    # pipeline. Union of what security.yml's jobs declare:
    # security-events:write + actions:read (codeql), checks:write
    # (actionlint's github-check reporter), pull-requests:write
    # (dependency-review's PR comment). Without this block every one of
    # those would be silently capped down to this workflow's top-level
    # `contents: read` and fail when run as part of this gate.
    permissions:
      contents: read
      security-events: write
      actions: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/security.yml

  build:
    name: Build and package release artifacts
    needs: [validate, ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifacts-dir: ${{ steps.build.outputs.artifacts-dir }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release artifacts
        id: build
        uses: ./.github/actions/build-release-artifacts
        with:
          version: ${{ needs.validate.outputs.version }}
          release-label: rc.${{ needs.validate.outputs.rc }}
          ci-result: ${{ needs.ci.result }}
          security-result: ${{ needs.security.result }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pvkernel-${{ needs.validate.outputs.tag }}
          path: ${{ steps.build.outputs.artifacts-dir }}
          if-no-files-found: error

  attest:
    name: Attest artifact provenance
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pvkernel-${{ needs.validate.outputs.tag }}
          path: release-artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*

  prerelease:
    name: Create GitHub pre-release
    needs: [validate, build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pvkernel-${{ needs.validate.outputs.tag }}
          path: release-artifacts

      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; refusing to overwrite it" >&2
            exit 1
          fi

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          version="${{ needs.validate.outputs.version }}"
          gh release create "$tag" \
            --title "pvKernel ${tag}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --notes "Release candidate for pvKernel v${version}. No stability guarantee; may contain release-blocking defects. See CHANGELOG.md for the v${version} entry." \
            release-artifacts/*
