[package]
name = "kernel"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true

# Disables Cargo's implicit test harness for this binary. `kernel` is a
# `#![no_std]` binary with its own `#[panic_handler]`; the default test
# harness links against `std` and its own panic runtime, which conflicts
# with ours (duplicate `panic_impl` lang item). This crate has no unit
# tests, so disabling the harness removes the conflict without affecting
# `cargo build`/`cargo run`.
[[bin]]
name = "kernel"
path = "src/main.rs"
test = false

[features]
default = []
# Enables a boot-time test that deliberately triggers a page fault to
# exercise the page-fault handler. Disabled by default; see
# docs/development/debugging.md for how to run it.
fault-tests = []
# Enables a boot-time test that maps, writes, unmaps, and then deliberately
# re-accesses a temporary virtual page to exercise the page-fault handler's
# not-present/supervisor/read classification. Disabled by default; see
# docs/development/memory-testing.md for how to run it.
mem-fault-tests = []
# Enables a boot-time test that writes from CPL0 to a supervisor read-only
# page and expects a protection-violation page fault. Combine with qemu-test
# for deterministic QEMU success; see docs/development/memory-testing.md.
supervisor-write-protection-test = []
# Enables QEMU isa-debug-exit support and expected-fault checks used by the
# deterministic headless QEMU tests. Disabled by default; see
# docs/development/testing.md for how to run them.
qemu-test = []
# Enables the ring-3 (CPL3) entry and provisional int 0x80 syscall test
# scaffolding shared by all three userspace-*-test features below. Not
# meant to be enabled directly; enabled transitively by exactly one of
# them (enforced by a `compile_error!` in `arch::x86_64::userspace`). See
# docs/architecture/userspace-entry.md.
userspace-test = []
# Runs a deterministic CPL3 test payload that exercises the int 0x80
# syscall ABI (unknown-syscall handling, the ABI version query, a
# debug-write syscall, non-volatile register preservation, and observing a
# PIT timer interrupt while at CPL3), then exits. See
# docs/development/userspace-testing.md.
userspace-syscall-test = ["userspace-test"]
# Runs a deterministic CPL3 test payload that executes CLI (an
# IOPL-sensitive instruction) at CPL3 with IOPL 0, expecting a #GP fault,
# then exits. See docs/development/userspace-testing.md.
userspace-privilege-fault-test = ["userspace-test"]
# Runs a deterministic CPL3 test payload that reads a supervisor-only
# kernel page, expecting a #PF fault with the USER_MODE bit set, then
# exits. See docs/development/userspace-testing.md.
userspace-supervisor-fault-test = ["userspace-test"]
# Runs deterministic alloc-backed heap success coverage on boot.
heap-test = []
# Requests an oversized allocation and expects a null result (QEMU test only).
heap-oom-test = ["heap-test"]
# Reads the unmapped heap guard page and expects a supervisor #PF (QEMU only).
heap-guard-fault-test = ["heap-test"]
# Deterministic kernel-task scheduling coverage; the normal boot smoke also
# exercises two tasks, while this feature gives it a dedicated QEMU job.
scheduler-test = []
scheduler-preemption-test = ["qemu-test"]
process-preemption-test = ["qemu-test"]
task-stack-guard-fault-test = ["qemu-test"]
task-capacity-test = []

[dependencies]
bootloader_api = "=0.11.17"
spin = "0.12.3"
uart_16550 = "0.4.0"
x86_64 = "0.15.2"

# bootloader_api: BootInfo structure and kernel output point
# spin: no_std synchronization primitives (Mutex, Once) for static kernel state
# uart_16550: diagnostic output through serial port
# x86_64: safe managing some CPU instructions
